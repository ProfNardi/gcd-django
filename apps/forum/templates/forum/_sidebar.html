<aside class="min-w-0 lg:w-56 lg:shrink-0">
  <nav aria-label="Forum" class="flex gap-1 overflow-x-auto text-sm lg:block lg:space-y-1">
    <a href="{% url 'forum:index' %}" {% if not directory and not active_category and active_feed != 'mine' %}aria-current="page"{% endif %} class="block whitespace-nowrap rounded-md px-3 py-2.5 {% if not directory and not active_category and active_feed != 'mine' %}bg-white font-semibold text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-900{% endif %}">Discussions</a>
    <a href="{% url 'forum:index' %}?view=groups" {% if directory %}aria-current="page"{% endif %} class="block whitespace-nowrap rounded-md px-3 py-2.5 {% if directory %}bg-white font-semibold text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-900{% endif %}">Groups</a>
    {% if user.is_authenticated %}<a href="{% url 'forum:index' %}?feed=mine" {% if active_feed == 'mine' %}aria-current="page"{% endif %} class="block whitespace-nowrap rounded-md px-3 py-2.5 {% if active_feed == 'mine' %}bg-white font-semibold text-slate-900 shadow-sm{% else %}text-slate-500 hover:text-slate-900{% endif %}">My discussions</a>{% endif %}
  </nav>
  <details class="mt-5 border-t border-slate-200 pt-5" open>
    <summary class="cursor-pointer px-3 text-xs font-medium uppercase tracking-wider text-slate-500">Groups</summary>
    <nav aria-label="Group tree" class="mt-2">{% include "forum/_group_tree.html" with groups=group_roots %}</nav>
  </details>
</aside>

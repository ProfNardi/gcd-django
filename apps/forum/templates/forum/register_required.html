{% extends "forum/base.html" %}
{% block view_body %}
<main class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-8 text-center">
  <h1 class="text-2xl font-semibold">Iscriviti</h1>
  <p class="mt-3 text-sm text-slate-500">Il forum è riservato agli utenti registrati GCD.</p>
  <div class="mt-6 flex justify-center gap-3">
    <a href="{% url 'register' %}" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">Iscriviti</a>
    <a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold">Accedi</a>
  </div>
</main>
{% endblock %}
